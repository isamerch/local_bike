version: 2

models:
  - name: int__sales
    description: '{{ doc("int__sales") }}'
    columns:
      - name: order_line
        description: "PK."
        tests:
          - unique
          - not_null
      - name: order_line_amount
        description: >
          Calculated column. Gross amount of the order line, after discount, in USD.
          A null discount_rate or list_price are treated as 0.
        config: 
          meta:
            currency: "USD"